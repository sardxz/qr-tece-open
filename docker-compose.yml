services:
  db:
    image: postgres:16-alpine
    container_name: tece-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tece}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tece_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tecedb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tece-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tece}:${POSTGRES_PASSWORD:-tece_dev_pass}@db:5432/${POSTGRES_DB:-tecedb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
